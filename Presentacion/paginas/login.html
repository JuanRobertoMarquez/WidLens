<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - BioNode</title>
    <link rel="shortcut icon" href="/Presentacion/images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="/Presentacion/css/login.css">
    <link rel="stylesheet" href="/Presentacion/css/transicion.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <img src="/Presentacion/images/Logo.png" alt="BioNode Logo" class="logo">
        </div>

        <h2>Bienvenido</h2>
        <p class="subtitle">Explora, registra y protege</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="contrasenia">Contraseña</label>
                <input type="password" id="contrasenia" name="contrasenia" placeholder="********" required>
            </div>

            <button type="submit" class="btn-primary">INICIAR SESIÓN</button>
            
            <div class="footer-links">
                <a href="recuperacion.html">¿Olvidaste tu contraseña?</a>
                <a href="crear-cuenta.html">Crear una cuenta</a>
            </div>
        </form>
    </div>

        <script>
            const loginForm = document.getElementById('loginForm');

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const correo = document.getElementById('correo').value;
                const contrasenia = document.getElementById('contrasenia').value;

                try {
                    const respuesta = await fetch('http://127.0.0.1:3000/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ correo, contrasenia })
                    });

                    // AQUÍ guardas la respuesta en 'resultado'
                    const resultado = await respuesta.json();

                    // AQUÍ usamos 'resultado' en lugar de 'datos'
                    if (resultado.exito) {
                        // 1. Guardamos la sesión real en el navegador
                        localStorage.setItem('usuarioWildLens', JSON.stringify(resultado.usuario));
                        localStorage.removeItem('usuario_activo'); // Limpiamos la vieja, por si acaso
                        
                        // 2. Alerta estilizada con SweetAlert2
                        Swal.fire({
                            title: `¡Bienvenido de vuelta, ${resultado.usuario.nombre}!`,
                            text: '¿Listo para explorar y proteger la biodiversidad?',
                            icon: 'success',
                            confirmButtonColor: '#2B7055', // El verde oficial de BioNode/WildLens
                            confirmButtonText: 'Entrar',
                            backdrop: `rgba(17, 78, 55, 0.2)` // Un fondo verdoso muy sutil
                        }).then(() => {
                            // 3. Redirigimos al Index SOLO hasta que el usuario cierre la alerta
                            window.location.href = '../Index.html'; 
                        });
                    } else {
                        // También agreguemos SweetAlert aquí para los errores de contraseña
                        Swal.fire({
                            title: 'Acceso Denegado',
                            text: resultado.mensaje,
                            icon: 'error',
                            confirmButtonColor: '#d33'
                        });
                    }
                } catch (error) {
                    console.error("Error de red:", error);
                    Swal.fire({
                        title: 'Error de Red',
                        text: 'No se pudo establecer comunicación con el servidor central de BioNode.',
                        icon: 'error',
                        confirmButtonColor: '#d33'
                    });
                }
            });
        </script>

</body>
</html>
