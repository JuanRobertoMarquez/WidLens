<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - BioNode</title>
    <link rel="shortcut icon" href="/Presentacion/images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="/Presentacion/css/login.css">
    <link rel="stylesheet" href="/Presentacion/css/transicion.css">
</head>
<body>

    <div class="login-container">
        <!-- Aquí va tu isologo de BioNode -->
        <div class="logo-container">
            <img src="/Presentacion/images/Logo.png" alt="BioNode Logo" class="logo">
        </div>

        <h2>Bienvenido</h2>
        <p class="subtitle">Explora, registra y protege</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <button type="submit" class="btn-primary">INICIAR SESIÓN</button>
            
            
            <div class="footer-links">
                <a href="recuperacion.html">¿Olvidaste tu contraseña?</a>
                <a href="crear-cuenta.html">Crear una cuenta</a>
            </div>
        </form>
    </div>

    <link rel="stylesheet" href="/Presentacion/css/transicion.css">
</body>
</html>
