<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - BioNode</title>
    <link rel="shortcut icon" href="/Presentacion/images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="/Presentacion/css/login.css">
    <link rel="stylesheet" href="/Presentacion/css/transicion.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <img src="/Presentacion/images/Logo.png" alt="BioNode Logo" class="logo">
        </div>

        <h2>Bienvenido</h2>
        <p class="subtitle">Explora, registra y protege</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label for="contrasenia">Contraseña</label>
                <input type="password" id="contrasenia" name="contrasenia" placeholder="********" required>
            </div>

            <button type="submit" class="btn-primary">INICIAR SESIÓN</button>
            
            <div class="footer-links">
                <a href="recuperacion.html">¿Olvidaste tu contraseña?</a>
                <a href="crear-cuenta.html">Crear una cuenta</a>
            </div>
        </form>
    </div>

    <script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const correo = document.getElementById('correo').value;
        const contrasenia = document.getElementById('contrasenia').value;

        try {
            const respuesta = await fetch('http://127.0.0.1:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo, contrasenia })
            });

            const resultado = await respuesta.json();

            if (respuesta.ok) {
                // 🔑 ¡EL TRUCO MAESTRO!
                // Guardamos de forma persistente el ID real que MySQL le asignó al usuario
                localStorage.setItem('usuario_activo', resultado.usuario.id_usuario);
                localStorage.setItem('usuario_nombre', resultado.usuario.nombre + ' ' + resultado.usuario.apellido);
                
                alert(`¡Bienvenido de vuelta, ${resultado.usuario.nombre}!`);
                
                // Redirigimos al Muro Principal (Index)
                window.location.href = '/Presentacion/Index.html'; 
            } else {
                alert("Error: " + resultado.error);
            }
        } catch (error) {
            console.error("Error de red:", error);
            alert("No se pudo establecer comunicación con el servidor.");
        }
    });
</script>

</body>
</html>
