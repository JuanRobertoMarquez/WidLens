<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - WildLens</title>
    <link rel="shortcut icon" href="/Presentacion/images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/Presentacion/css/login.css">
    <link rel="stylesheet" href="/Presentacion/css/estilo_index.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

</head>
<body>

    <header class="navbar">
        <div class="nav-content">
            
            <div class="nav-left">
                <div class="logo-container">
                    <img src="/Presentacion/images/WildLens.png" alt="Logo WildLens" class="logo-logo">
                </div>
                
                <nav class="nav-links">
                    <a href="../Index.html" class="active">Home</a>
                    <a href="#">Comunidad ⌵</a>
                    <a href="explorador.html">Explorar ⌵</a>
                </nav>
            </div>
        
            <div class="nav-right">
                <div id="menu-visitante">
                    <a href="login.html">Acceder</a> o 
                    <a href="crear-cuenta.html">Crear una cuenta</a>       
                </div>
            </div>
            
        </div>
    </header>

    <div class="split-layout">
        
        <div class="image-section" id="dynamic-bg">
            <div class="photo-credit">
                <img src="https://ui-avatars.com/api/?name=W&background=2B7055&color=fff" alt="Avatar" class="credit-avatar" id="bg-avatar">
                <div class="credit-text">
                    <p><em id="bg-especie">Cargando especie...</em> observado por</p>
                    <h4 id="bg-autor">Cargando guardián...</h4>
                    <p id="bg-lugar" style="display: none;">en la naturaleza</p>
                </div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-container">
                <div class="logo-container">
                    <a href="../Index.html" style="text-decoration: none;">
                        <h1 style="color: #2B7055; font-family: 'Lora', serif;">🌿 WildLens</h1>
                    </a>
                </div>

                <h2>Bienvenido de vuelta</h2>

                <form id="loginForm">
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="correo" name="correo" placeholder="Correo electrónico" required maxlength="100">
                    </div>

                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="contrasenia" name="contrasenia" placeholder="Contraseña" required maxlength="8">
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Recuérdeme
                        </label>
                        <a href="/Presentacion/paginas/solicitar_recuperacion.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>

                        <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI" style="margin-bottom: 20px; display: flex; justify-content: center;"></div>
                   
                    <button type="submit" class="btn-primary">Acceder</button>
                    
                    <div class="footer-links">
                        <p>¿No tienes una cuenta? <a href="/Presentacion/paginas/crear-cuenta.html">Crear una cuenta</a></p>
                    </div>
                </form>
            </div>
        </div>

    </div>
        <script src="/Negocio/src/presentacion/login.js"></script>

</body>
</html>
