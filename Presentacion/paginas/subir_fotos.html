<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">     <title>WildLens - Subir Fotos</title>
    <link rel="stylesheet" href="../css/estilo_index.css">
    <link rel="stylesheet" href="../css/estilo_subirfoto.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
</head>
<body>

<div class="main-container">

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="nav-content">
            <div class="logo-container">
                <img src="../images/Logo.png" alt="WildLens Logo" class="logo-logo">
                <span class="logo-text">WildLens</span>
            </div>
            <nav class="nav-links">
                <a href="../Index.html">Home</a>
                <a href="#" class="active">Registros</a>
                <a href="#">Contactos</a>
                <a href="#" class="btn-nav">Explorar</a>
            </nav>
        </div>
    </header>

    <div class="page-wrapper">

        <!-- STEPPER -->
        <div class="stepper">
            <div class="step active">
                <div class="step-circle">1</div>
                <span>Subir Fotos</span>
            </div>
            <div class="step-line"></div>
            <div class="step">
                <div class="step-circle">2</div>
                <span>Selección de Ubicación</span>
            </div>
            <div class="step-line"></div>
            <div class="step">
                <div class="step-circle">3</div>
                <span>Detalles de Especie</span>
            </div>
        </div>

        <!-- SECCIÓN SUBIR FOTOS -->
        <div class="upload-section" id="uploadSection">
            <h2 class="section-title">Subir Fotos</h2>

            <!-- Grid de 3 slots -->
            <div class="photo-grid" id="photoGrid">
                <div class="photo-slot" onclick="triggerSlot(0)" id="slot0">
                    <span class="slot-icon">📷</span>
                    <button class="remove-btn" onclick="removePhoto(event, 0)">✕</button>
                </div>
            </div>

            <!-- Input oculto -->
            <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">

            <!-- Botón subir -->
            <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
                <span>+</span> Subir Fotos
            </button>

            <!-- Hint -->
            <p class="upload-hint">
                Descripción de un propósito o descripción de fotos.<br>
                Formatos: JPG, PNG, WEBP · Máx. 10 MB c/u
            </p>

            <!-- Barra de progreso -->
            <div class="progress-bar-wrap" id="progressWrap">
                <p class="progress-label">Cargando fotos...</p>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- Contador -->
            <p class="photo-counter"><span id="photoCount">0</span> / 3 fotos</p>

            <!-- Botón continuar -->
            <button class="btn-continuar" id="btnContinuar" disabled onclick="irAMapa()">
                Continuar
            </button>
        </div>

    </div>
</div>

<script src="../src/datos/Subir_foto.js"></script>

</body>
</html>
