<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - WildLens</title>
        <link rel="shortcut icon" href="../images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/estilo_index.css"> 
    <link rel="stylesheet" href="../css/estilo_perfil.css"> 
    
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="nav-content">
            <div class="nav-left">
                <div class="logo-container">
                    <span class="logo-text">WildLens</span>
                </div>
                <nav class="nav-links">
                    <a href="../index.html">Home</a>
                    <a href="comunidad.html">Comunidad ⌵</a>
                    <a href="explorador.html">Explorar ⌵</a>
                </nav>
            </div>

            <div class="nav-right">
                <div id="menu-visitante">
                    <a href="login.html">Acceder o Crear una cuenta</a>
                </div>

                <div id="menu-usuario" style="display: none;" class="user-dropdown">
                    <a href="subir_fotos.html" class="btn-subir-nav">Cargar observación</a>
                    <div class="dropdown-container">
                        <button class="dropbtn">
                            <img id="nav-avatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar" class="nav-avatar-img">
                            <span id="nav-nombre-usuario">Bienvenido</span> ⌵
                        </button>
                        <div class="dropdown-content">
                            <a href="perfil.html">Mi Perfil</a>
                            <a href="mis_observaciones.html">Mis Observaciones</a>
                            <hr>
                            <a href="login.html" id="btn-cerrar-sesion" style="color: #d9534f;">Cerrar sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="perfil-wrapper-lite">
            
            <div class="perfil-header-lite">
                <div class="profile-cover" style="background-image: url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1200');"></div>
                
                <div class="profile-content">
                    <div class="avatar-wrapper">
                        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar" class="avatar-lite" id="avatar-perfil">
                    </div>
                    <h1 id="ui-nombre">Cargando...</h1>
                    <p id="ui-correo" class="correo-lite">Cargando...</p>
                    <a href="Editar_perfil.html" class="btn-editar-lite">✏️ Editar mi perfil</a>
                </div>
            </div>

            <div class="stats-row-lite">
                <div class="stat-box-lite">
                    <div class="stat-icon-lite" style="color: #2B7055; background: #e8f5e9;">📷</div>
                    <div class="stat-text-lite">
                        <span class="stat-num-lite" id="ui-fotos">0</span>
                        <span class="stat-label-lite">Fotos subidas</span>
                    </div>
                </div>
                <div class="stat-box-lite">
                    <div class="stat-icon-lite" style="color: #E58933; background: #fff3e0;">🐾</div>
                    <div class="stat-text-lite">
                        <span class="stat-num-lite" id="ui-total">0</span> 
                        <span class="stat-label-lite">Animales distintos</span>
                    </div>
                </div>
            </div>

            <div class="observaciones-section-lite">
                <h3 class="seccion-titulo-lite">Mi diario de descubrimientos</h3>
                <div class="lista-observaciones-lite" id="lista-observaciones">
                    <p style="color: #888; font-size: 15px; text-align: center; padding: 40px 0;">Cargando tus aventuras...</p>
                </div>
            </div>

        </div>

    <script src="../js/src/presentacion/perfil.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuVisitante = document.getElementById('menu-visitante');
            const menuUsuario = document.getElementById('menu-usuario');
            const navNombreUsuario = document.getElementById('nav-nombre-usuario');
            const navAvatar = document.getElementById('nav-avatar');
            const usuarioString = localStorage.getItem('usuarioWildLens');

            if (usuarioString) {
                const usuarioLogueado = JSON.parse(usuarioString);
                if (menuVisitante) menuVisitante.style.display = 'none';
                if (menuUsuario) menuUsuario.style.display = 'flex';
                if (navNombreUsuario) navNombreUsuario.innerText = usuarioLogueado.nombre;
                
                // --- SOLUCIÓN AQUÍ: Validamos la URL del avatar del navbar ---
                if (navAvatar && usuarioLogueado.avatar) {
                    navAvatar.src = usuarioLogueado.avatar.startsWith('http') 
                        ? usuarioLogueado.avatar 
                        : 'https://widlens.onrender.com' + usuarioLogueado.avatar;
                }
            }

            const btnCerrarSesion = document.getElementById('btn-cerrar-sesion');
            if(btnCerrarSesion) {
                btnCerrarSesion.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('usuarioWildLens');
                    window.location.href = '../index.html'; 
                });
            }
        });
    </script>
</body>
</html>
