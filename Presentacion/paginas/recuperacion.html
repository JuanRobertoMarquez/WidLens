<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - WildLens</title>
    <link rel="shortcut icon" href="../images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/recuperacion.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <a href="../index.html" class="branding-logo">
        WildLens
    </a>

    <div class="reset-container">
        <h2><i class="fas fa-key"></i> Nueva Contraseña</h2>
        <p>Define tu nueva contraseña para recuperar el acceso a tu cuenta.</p>

        <form class="reset-form">

<div class="input-group">
    <label for="nueva-contrasenia">Nueva Contraseña</label>

    <div class="input-with-icon password-container">
        <i class="fas fa-lock"></i>

        <input type="password" id="nueva-contrasenia" name="contrasenia" required minlength="8" maxlength="8" placeholder="Mínimo 8 caracteres" >

        <button type="button" id="togglePassword" class="toggle-password">
            <i class="fas fa-eye"></i>
        </button>
    </div>
</div>

<div class="password-strength-container" id="strength-container-rec">
    <div class="strength-bar-bg">
        <div class="strength-bar" id="strength-bar-rec"></div>
    </div>

    <ul class="strength-reqs">
        <li id="req-length-rec"><i class="fas fa-circle"></i> Mínimo 8 caracteres</li>
        <li id="req-upper-rec"><i class="fas fa-circle"></i> 1 Mayúscula</li>
        <li id="req-lower-rec"><i class="fas fa-circle"></i> 1 Minúscula</li>
        <li id="req-number-rec"><i class="fas fa-circle"></i> 1 Número</li>
        <li id="req-special-rec"><i class="fas fa-circle"></i> 1 Carácter especial (@,#,$,etc)</li>
    </ul>
</div>

<div class="input-group">
    <label for="confirm-contrasenia">Confirmar Contraseña</label>

    <div class="input-with-icon password-container">
        <i class="fas fa-lock"></i>

        <input type="password" id="confirm-contrasenia" required minlength="8" maxlength="8" placeholder="Repite la nueva contraseña">

        <button type="button" id="toggleConfirmPassword" class="toggle-password">
            <i class="fas fa-eye"></i>
        </button>
    </div>
</div>

            <div class="button-group">
                <button type="submit" class="btn btn-submit" id="btn-guardar">Guardar contraseña</button>
                <a href="login.html" class="btn btn-cancel" style="text-decoration: none; text-align: center; display: inline-block; line-height: 1.4;">Cancelar</a>
            </div>
        </form>
    </div>

    <script src="../js/src/presentacion/recuperacion.js"></script>
</body>
</html>
