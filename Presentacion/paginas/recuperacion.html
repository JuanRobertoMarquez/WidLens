<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <link rel="shortcut icon" href="/Presentacion/images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="/Presentacion/css/recuperacion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/Presentacion/css/transicion.css">
</head>
<body>
    <div class="reset-container">
        <form class="reset-form">
            <h2><i class="fas fa-key"></i> Restablecer Contraseña</h2>
            <p>Ingresa tu correo y define tu nueva contraseña para recuperar el acceso.</p>

            <div class="input-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="ejemplo@gmail.com">
            </div>

            <div class="input-group">
                <label for="nueva-contrasenia">Nueva Contraseña</label>
                <input type="password" id="nueva-contrasenia" name="contrasenia" required placeholder="Mínimo 8 caracteres">
            </div>

            <div class="input-group">
                <label for="confirm-contrasenia">Confirmar Contraseña</label>
                <input type="password" id="confirm-contrasenia" required placeholder="Repite la nueva contraseña">
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-cancel" onclick="window.location.href='login.html'">Cancelar</button>
                <button type="submit" class="btn btn-submit">Continuar</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.querySelector('.reset-form');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); 

            const correo = document.getElementById('correo').value;
            const nuevacontrasenia = document.getElementById('nueva-contrasenia').value;
            const confirmcontrasenia = document.getElementById('confirm-contrasenia').value;

            if (nuevacontrasenia !== confirmcontrasenia) {
                alert("Las contraseñas no coinciden. Inténtalo de nuevo.");
                return;
            }

            // Simulación temporal actualizada con las nuevas claves de la BD
            localStorage.setItem('usuario_password', nuevacontrasenia);
            
            alert("¡Contraseña restablecida con éxito!");
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
