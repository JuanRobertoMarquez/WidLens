<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - WildLens</title>
    <link rel="shortcut icon" href="/Presentacion/images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/recuperacion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <a href="../index.html" class="branding-logo">
        🌿 WildLens
    </a>
    
    <div class="reset-container">
        <form class="reset-form">
            <h2><i class="fas fa-key"></i> Nueva Contraseña</h2>
            <p>Define tu nueva contraseña para recuperar el acceso a WildLens.</p>

            <div class="input-group">
                <label for="nueva-contrasenia">Nueva Contraseña</label>
                <input type="password" id="nueva-contrasenia" name="contrasenia" required maxlength="8" placeholder="Mínimo 8 caracteres">
            </div>

            <div class="input-group">
                <label for="confirm-contrasenia">Confirmar Contraseña</label>
                <input type="password" id="confirm-contrasenia" required maxlength="8" placeholder="Repite la nueva contraseña">
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-cancel" onclick="window.location.href='login.html'">Cancelar</button>
                <button type="submit" class="btn btn-submit">Guardar contraseña</button>
            </div>
        </form>
    </div>

    <script src="/Negocio/src/presentacion/recuperacion.js"></script>
</body>
</html>
