<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisa tu correo - WildLens</title>
    <link rel="shortcut icon" href="/Presentacion/images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/recuperacion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="reset-container" style="text-align: center;">
        <h2 style="color: #2B7055; font-size: 3rem; margin-bottom: 10px;">
            <i class="fas fa-envelope-open-text"></i>
        </h2>
        <h2>Revisa tu bandeja de entrada</h2>
        
        <p style="margin-top: 15px;">Te hemos enviado un enlace mágico a tu correo electrónico para verificar tu cuenta.</p>
        
        <div style="background-color: #f8f9fa; border-left: 4px solid #2B7055; padding: 15px; margin: 20px 0; text-align: left; font-size: 0.9rem;">
            <strong>⏱️ Importante:</strong> El enlace expirará en 24 horas por motivos de seguridad. No olvides revisar tu carpeta de Spam o Correo no deseado.
        </div>

        <div class="button-group" style="flex-direction: column; gap: 10px;">
            <button type="button" class="btn btn-submit" onclick="window.location.href='login.html'">Ya verifiqué mi cuenta</button>
            <button type="button" class="btn btn-cancel" onclick="alert('Función de reenvío en construcción.')">No recibí el correo</button>
        </div>
    </div>
</body>
</html>
