<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - WildLens</title>
    <link rel="shortcut icon" href="../images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/recuperacion.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <a href="../index.html" class="branding-logo">
        <img src="../images/WildLens.png" alt="Logo WildLens">
    </a>

    <div class="reset-container">
        <h2><i class="fas fa-lock"></i> Recuperar Acceso</h2>
        <p>Ingresa tu correo asociado a WildLens y te enviaremos un enlace para restablecer tu contraseña.</p>

        <form class="solicitud-form">
            
            <div class="input-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="ejemplo@gmail.com">
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-submit" id="btn-enviar">Enviar enlace</button>
                <a href="login.html" class="btn btn-cancel" style="text-decoration: none; text-align: center; display: inline-block; line-height: 1.4;">Cancelar</a>
            </div>
            
        </form>
    </div>

    <script src="../js/src/presentacion/solicitar_recuperacion.js"></script>
</body>
</html>
