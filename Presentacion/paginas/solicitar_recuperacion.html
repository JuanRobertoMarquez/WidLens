<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - WildLens</title>
    <link rel="shortcut icon" href="../images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/estilo_index.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <header class="navbar">
        <div class="nav-content">
            <div class="nav-left">
                <div class="logo-container">
                    <img src="../images/WildLens.png" alt="Logo WildLens" class="logo-logo">
                </div>
                <nav class="nav-links">
                    <a href="../index.html" class="active">Home</a>
                    <a href="#">Comunidad ⌵</a>
                    <a href="explorador.html">Explorar ⌵</a>
                </nav>
            </div>
            <div class="nav-right">
                <div id="menu-visitante">
                    <a href="login.html">Acceder</a> o 
                    <a href="crear-cuenta.html">Crear una cuenta</a>       
                </div>
            </div>
        </div>
    </header>

    <div class="split-layout">
        <div class="image-section"></div>

        <div class="form-section">
            <div class="form-container">
                <div class="logo-container">
                    <a href="../index.html" style="text-decoration: none;">
                        <h1 style="color: #2B7055; font-family: 'Lora', serif;">🌿 WildLens</h1>
                    </a>
                </div>

                <h2 style="font-size: 24px;">Recuperar Acceso</h2>
                <p style="color: #555; margin-bottom: 25px; font-size: 14px;">Ingresa tu correo asociado a WildLens y te enviaremos un enlace para restablecer tu contraseña.</p>

                <form class="solicitud-form">
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="correo" name="correo" required placeholder="ejemplo@gmail.com">
                    </div>

                    <button type="submit" class="btn-primary" id="btn-enviar" style="margin-bottom: 15px;">Enviar enlace</button>
                    
                    <div class="footer-links">
                        <p><a href="login.html">Regresar al Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/src/presentacion/solicitar_recuperacion.js"></script>
</body>
</html>
