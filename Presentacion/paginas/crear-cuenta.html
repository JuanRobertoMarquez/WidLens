<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="shortcut icon" href="/Presentacion/images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="/Presentacion/css/crear-cuenta.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/Presentacion/css/transicion.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="registro-container">
        <form class="registro-form">
            <h2>Crear Nueva Cuenta</h2>
            <p>Ingresa tus datos para registrarte.</p>

            <div class="input-group">
                <label for="nombre">Nombre(s)</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Antonio">
            </div>

            <div class="input-group">
                <label for="apellido">Apellidos</label>
                <input type="text" id="apellido" name="apellido" required placeholder="Ej: Pérez García">
            </div>

            <div class="input-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="ejemplo@gmail.com">
            </div>

            <div class="input-group">
                <label for="contrasenia">Contraseña</label>
                <input type="password" id="contrasenia" name="contrasenia" required placeholder="Mínimo 8 caracteres">
            </div>

            <div class="input-group">
                <label for="confirm-contrasenia">Confirmar Contraseña</label>
                <input type="password" id="confirm-contrasenia" required placeholder="Repite la contraseña">
            </div>

            <div class="button-group">
                <button type="submit" class="button-continuar">Continuar</button>
                <button type="button" class="button-cancelar" onclick="history.back()">Cancelar</button>
            </div>
        </form>
    </div>

    <div class="footer-links">
        <a href="login.html">Ya tengo una cuenta</a>
    </div>

    <script>
        const registroForm = document.querySelector('.registro-form');

            registroForm.addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const correo = document.getElementById('correo').value;
            const contrasenia = document.getElementById('contrasenia').value;
            const confirmContrasenia = document.getElementById('confirm-contrasenia').value;

            if (contrasenia !== confirmContrasenia) {
                alert("Las contraseñas no coinciden. Por favor, verifícalas.");
                return;
            }

            try {
                // Hacemos la petición POST real a Node.js
                const respuesta = await fetch('http://127.0.0.1:3000/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, apellido, correo, contrasenia })
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    alert("¡Cuenta creada exitosamente! Redirigiendo al inicio de sesión...");
                    window.location.href = 'login.html';
                } else {
                    alert("Error al registrar: " + resultado.error);
                }
            } catch (error) {
                console.error("Error de red:", error);
                alert("No se pudo conectar con el servidor backend.");
            }
        });
    </script>
</body>
</html>
