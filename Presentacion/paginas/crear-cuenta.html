<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="shortcut icon" href="/Presentacion/images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="/Presentacion/css/crear-cuenta.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/Presentacion/css/transicion.css">
</head>
<body>
    <div class="registro-container">
        <form class="registro-form">
            <h2>Crear Nueva Cuenta</h2>
            <p>Ingresa tus datos para registrarte.</p>

            <div class="input-group">
                <label for="nombres">Nombre(s)</label>
                <input type="text" id="nombres" name="nombres" required placeholder="Ej: Juan Antonio">
            </div>

            <div class="input-group">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" required placeholder="Ej: Pérez García">
            </div>
            
            <div class="input-group">
                <label for="boleta">Boleta</label>
                <input type="text" id="boleta" name="boleta" required placeholder="Ej: 2024601234">
            </div>

            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="ejemplo@gmail.com">
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres">
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="Repite la contraseña">
            </div>

            <div class="button-group">
                <button type="submit" class="button-continuar">Continuar</button>
                <button type="button" class="button-cancelar" onclick="history.back()">Cancelar</button>
            </div>
        </form>
    </div>

    <script>
        const registroForm = document.querySelector('.registro-form');

        registroForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue

            // 1. Obtener los valores de los campos
            const nombres = document.getElementById('nombres').value;
            const apellidos = document.getElementById('apellidos').value;
            const email = document.getElementById('email').value;
            const boleta = document.getElementById('boleta').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // 2. Validar que las contraseñas coincidan
            if (password !== confirmPassword) {
                alert("Las contraseñas no coinciden. Por favor, verifícalas.");
                return;
            }

            // 3. Guardar los datos en localStorage (para simular la base de datos)
            // Guardamos el nombre completo combinando nombre y apellido
            localStorage.setItem('usuario_nombre', nombres + ' ' + apellidos);
            localStorage.setItem('usuario_email', email);
            localStorage.setItem('usuario_boleta', boleta);
            // Opcional: guardar contraseña (generalmente no se debe hacer en texto plano, pero sirve para la simulación)
            localStorage.setItem('usuario_password', password);

            // 4. Mensaje de éxito y redirección
            alert("¡Cuenta creada exitosamente! Ahora puedes iniciar sesión.");
            window.location.href = '/Presentacion/paginas/login.html';
        });
    </script>

    <link rel="stylesheet" href="/Presentacion/css/transicion.css"></body>
</html>
