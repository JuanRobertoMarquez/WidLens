<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Observaciones - WildLens</title>
    <link rel="shortcut icon" href="../images/mini-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/estilo_index.css"> 
    <link rel="stylesheet" href="../css/estilo_observaciones.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="nav-content">
            <div class="nav-left">
                <div class="logo-container">
                    <span class="logo-text">WildLens</span>
                </div>
                <nav class="nav-links">
                    <a href="../index.html">Home</a>
                    <a href="mis_observaciones.html" class="active">Mis Observaciones</a>
                    <a href="explorador.html">Explorar ⌵</a>
                </nav>
            </div>

            <div class="nav-right">
                <div class="user-dropdown">
                    <a href="./paginas/subir_fotos.html" class="btn-subir-nav">Cargar observación</a>
                    <div class="dropdown-container">
                        <button class="dropbtn">
                            <img id="nav-avatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar" class="nav-avatar-img">
                            <span id="nav-nombre-usuario">Cargando...</span> ⌵
                        </button>
                        <div class="dropdown-content">
                            <a href="./perfil.html">Mi Perfil</a>
                            <a href="./mis_observaciones.html">Mis Observaciones</a>
                            <hr>
                            <a href="login.html" onclick="cerrarSesionGlobal(); return false;" id="btn-cerrar-sesion">
                                Cerrar sesión
                            </a>                           
                             <hr>
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="header-observaciones">
        <div class="header-content">
            <h1 class="titulo-vista">Observaciones</h1>
            
            <div class="buscador-bar">
                <div class="input-group">
                    <span class="icono-lupa">🔍</span>
                    <input type="text" id="input-filtro" placeholder="Especie o estatus...">
                </div>
                <button id="btn-buscar" class="btn-buscar">Busca</button>
                <button class="btn-filtros">⚙ Filtros</button>
            </div>
        </div>
    </div>

    <div class="barra-estadisticas">
        <div class="stats-container">
            <div class="stat-item tab-activo">
                <span class="stat-numero" id="stat-obs">0</span>
                <span class="stat-label">OBSERVACIONES</span>
            </div>
            <div class="stat-item">
                <span class="stat-numero" id="stat-esp">0</span>
                <span class="stat-label">ESPECIES</span>
            </div>
            <div class="stat-item">
                <span class="stat-numero" id="stat-val">0</span>
                <span class="stat-label">VALIDADOS</span>
            </div>
        </div>
    </div>

    <div class="grid-container" id="contenedor-cuadricula">
        <p class="mensaje-carga">Cargando tus descubrimientos...</p>
    </div>

    <script src="../js/src/presentacion/mis_observaciones.js"></script>
    <script src="../js/src/presentacion/navbar.js"></script>

</body>
</html>
