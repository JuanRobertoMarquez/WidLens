                    <a href="./comunidad.html">Comunidad ⌵</a>

            </div>

            <div class="nav-right">

                    <a href="./login.html" class="btn-acceder">Acceder</a>

                </div>

                <div id="menu-usuario" class="user-dropdown"">
                    <a href="./subir_fotos.html" class="btn-subir-nav">Cargar observación</a>
                    <div class="dropdown-container">
                        <button class="dropbtn">
                            <img id="nav-avatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar" class="nav-avatar-img">

                        <div class="dropdown-content">
                            <a href="./perfil.html">Mi Perfil</a>

                                Cerrar sesión
                            </a>                           
                             <hr>
                            </div>
                    </div>
                </div>
            </div>
            
        </div>
    </header>

    <main class="explorador-main" style="margin-top: 75px;">

            <h2>Mapa de Avistamientos Colectivos</h2>
            <div class="title-underline"></div>
        </div>
        
        <div class="map-wrapper">
            <div id="mapa-explorador"></div>
        </div>
    </main>

    <div id="mapa-explorador"></div>

    <div id="modal-avistamiento" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            
            <img id="modal-img" src="" alt="Foto del avistamiento">
            
            <div class="modal-info">
                <h2 id="modal-especie">Nombre Especie</h2>
                <p class="modal-ubicacion">📍 <strong>Ubicación exacta:</strong> <span id="modal-coords"></span></p>
                
                <div class="modal-registro">
                    📸 Registrado por: <strong id="modal-usuario"></strong> <br>
                    📅 Fecha: <span id="modal-fecha"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
