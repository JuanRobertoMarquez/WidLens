<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Ubicación - WildLens</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Reseteo básico para que no haya márgenes en blanco */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%; /* Ocupar toda la altura de la ventana */
            font-family: 'Open Sans', sans-serif;
        }

        /* El contenedor del mapa ocupa toda la pantalla de fondo */
        #map {
            height: 100vh;
            width: 100vw;
            position: absolute; /* Para que quede de fondo */
            top: 0;
            left: 0;
            z-index: 1; /* Nivel base */
        }

        /* Tarjeta flotante con la información (estilo WildLens) */
        .info-card {
            position: absolute;
            bottom: 40px; /* Separación desde abajo */
            left: 50%;
            transform: translateX(-50%); /* Centrado perfecto */
            z-index: 1000; /* Por encima del mapa */
            
            background-color: white;
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            min-width: 320px;
        }

        .info-card h2 {
            font-family: 'Montserrat', sans-serif;
            color: #2B7055; /* Tu verde oscuro */
            font-size: 18px;
            margin-bottom: 10px;
        }

        .info-card p {
            color: #555555;
            font-size: 14px;
            margin-bottom: 20px;
            background: #F9F8F2; /* Tu crema de fondo */
            padding: 10px;
            border-radius: 8px;
            font-family: monospace; /* Para que los números se vean alineados */
        }

        .btn-confirmar {
            background-color: #2B7055;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-confirmar:hover {
            transform: translateY(-2px);
            background-color: #225a44;
        }

        /* Botón de regreso flotante (opcional) */
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            color: #2B7055;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← Regresar</a>

    <div id="map"></div>

    <div class="info-card">
        <h2>Paso 2: Selección de Ubicación</h2>
        <p id="coords-display">Arrastra el pin al lugar del avistamiento</p>
        <button class="btn-confirmar" onclick="guardarUbicacion()">Confirmar Ubicación</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
<script src="Mapa.js"></script>
</body>
</html>
